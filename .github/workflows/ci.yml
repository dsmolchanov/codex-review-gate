name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest PyYAML
      # The behaviour tests execute the gate's run: block under bash against a
      # stubbed gh. A check not demonstrated to fail is not a check.
      - run: python3 -m pytest tests -q
      - name: Actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint .github/workflows/codex-review-window.yml .github/workflows/codex-verdict-waker.yml .github/workflows/ci.yml
