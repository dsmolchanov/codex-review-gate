name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest PyYAML
      # The behaviour tests execute the gate's run: block under bash against a
      # stubbed gh. A check not demonstrated to fail is not a check.
      - run: python3 -m pytest tests -q
      - name: Actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          # `job.workflow_ref` / `job.workflow_sha` are documented job-context
          # properties (the reusable workflow's own file and commit, where
          # `github.workflow_*` name the caller's) and are populated at runtime
          # — observed in run 33587072261 of this repository — but actionlint's
          # type table (through v1.7.12) predates them. Ignore exactly those
          # two messages; everything else stays a hard failure.
          ./actionlint \
            -ignore 'property "workflow_ref" is not defined in object type {check_run_id' \
            -ignore 'property "workflow_sha" is not defined in object type {check_run_id' \
            .github/workflows/codex-review-window.yml .github/workflows/codex-verdict-waker.yml .github/workflows/ci.yml
