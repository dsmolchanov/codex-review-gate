name: codex-review-window
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # A review that lands after the wait window expired must re-open the gate;
  # `pull_request` events alone never fire again for a late review.
  pull_request_review:
    types: [submitted]
  # Called by the one-screen stub every other repository installs. The gate
  # logic lives HERE, in the only repository that has its executable tests, and
  # arrives in a consumer repo as a `uses:` line rather than as 460 lines of
  # reviewable content. Distributing the body instead put the SAME file in front
  # of eight independent reviewers at once: 21 blocking findings on one file, no
  # two repositories agreeing, several asking for tests that exist in two of the
  # eight. Reviewing it once, where the tests are, is the whole point.
  workflow_call:
    secrets:
      CODEX_REQUEST_TOKEN:
        required: false
      SLACK_WEBHOOK:
        required: false

# `issue_comment` is DELIBERATELY ABSENT. A comment event runs the workflow from
# the default branch and its check run is bound to the default-branch SHA, so it
# can never satisfy a PR's required check — and because this job's concurrency
# group is keyed on the PR number, a comment-triggered run would CANCEL the real
# PR-associated run. This gate posts its own anchor comment, which made an
# earlier revision self-cancelling.
# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#issue_comment
#
# That absence is what `codex-verdict-waker.yml` exists to work around, and the
# workaround is deliberately NOT "listen to issue_comment here". The waker is a
# SEPARATE workflow that is not a required check and holds its own concurrency
# group, so neither problem above applies to it; when a Codex comment lands it
# RE-RUNS this workflow's PR-bound run, which reports against the PR head and
# therefore does satisfy the required check. Both defects are avoided by never
# letting a comment event be the thing that reports the verdict.
#
# Why that indirection is worth a second file: Codex delivers most clean
# verdicts as a summary COMMENT, not as a formal review. Over one day of fleet
# traffic, 15 of 17 green gate runs passed on the comment path and only 2 on a
# formal review. A design that re-entered on `pull_request_review` alone would
# therefore leave ~88% of clean pull requests red until someone re-ran the job
# by hand.
#
# The job key below MUST match the required-status-check name in branch
# protection. GitHub matches required checks against the job key (or the
# reported check-run name), NOT a custom display name. Do not add `name:`
# at the job level unless you also update branch protection.
#
# ---------------------------------------------------------------------------
# WHAT THIS GATE DOES, AND DELIBERATELY DOES NOT DO
# ---------------------------------------------------------------------------
# It answers exactly one question: does Codex report a blocking finding on the
# CURRENT head commit? Verdict states are PASS / BLOCK / UNKNOWN, and only PASS
# exits 0. That is the whole contract. What counts as "blocking" narrows after
# the review budget is spent: for the first FULL_ROUNDS completed review
# generations it is any P0/P1/[BLOCKER]; from then on it is P0 only, with P1s
# still reported (badges kept, so Auto-fix still sees them) but no longer
# holding the merge. UNKNOWN fails in every round — the budget never overrides
# a missing verdict.
#
# It counts REVIEW GENERATIONS statelessly, from COMPLETED head-bound verdicts:
# a Codex review's commit_id, or a Codex clean-summary comment naming a head.
# Request anchors never advance the count — an anchor proves a request was
# posted, not that review completed. The count is derived only from
# CODEX_BOT-authored artifacts, so pre-degrading a PR would take Codex's own
# identity: the same trust bar every verdict already rests on. Re-review
# requests are scoped to the commit range since the last completed verdict and
# require still-open prior findings to be re-emitted with their badges, so an
# unresolved P1 on an earlier head cannot vanish behind a clean delta.
#
# It still does NOT enforce a diff budget, apply labels, or accept a waiver
# command. An earlier revision of this file did; the machinery grew it from 81
# to 591 lines and drew five rounds of valid P1 findings, three of which were
# unfixable here at all — a workflow using GITHUB_TOKEN cannot authenticate a
# marker it reads (every workflow is `github-actions[bot]`), and a stateless
# run cannot hold a lease. Nothing here reads a marker to AUTHORIZE anything:
# round state only narrows the blocking severity on the current head, and only
# after three completed verdicts by the reviewer itself.
#
# A human stops automation by applying the `needs-human` label, which server.py
# treats as terminal. Human-applied, so there is nothing to forge and no lease to
# hold.
#
# History of the two races this file exists to lose no more:
#
# 2026-07-02: upgraded from a blind sleep to a real gate. The old soak lost the
# race — one PR merged and Codex posted a P1 nineteen seconds later.
#
# 2026-08-13: the gate still lost it. Three PRs merged with open P1s because the
# wait had an advisory fallback that PASSED on timeout. In the incident that motivated this file the gate
# gave up on 56a0455 at 08:12:35, Codex posted two P1s on that same commit at
# 08:13:34, and auto-merge squashed it into main at 08:15:23. So: a 15-minute
# window, a timeout that FAILS, and a late review that re-triggers the gate.
#
# Exit-0 audit — exactly TWO paths, each deliberate. `tests/test_gate_workflow.py`
# asserts the count and the static invariants; `tests/test_gate_behavior.py`
# EXECUTES this script against a stubbed GitHub API and asserts the exit code on
# each path, because exit 0 means "this pull request may merge".
#   1. a head-bound clean signal with no formal review (Codex 👍 on this head's
#      anchor, or the verbatim "Codex Review: Didn't find any major issues."
#      summary naming this head and carrying no P0/P1 marker), re-checked for a
#      late formal review before it is honoured;
#   2. a head-bound review carrying no blocking marker — P0/P1/[BLOCKER] on
#      full rounds, P0 only once the review budget is spent.
# Everything else — no verdict, quota exhausted, any GitHub API failure, an
# unresolvable or superseded head, any open blocker — exits 1.
#
# There is NO repo-wide opt-out. A `fast-merge` repo topic disabled this gate
# for every PR, indefinitely and unattributably; a deliberate opt-out needs an
# authenticated identity, which is controller work
# (an App-owned controller, out of scope here).

# NO `concurrency:` HERE — deliberately. This workflow is also called by the
# one-screen stub each consumer repo installs, and that stub owns the group. A
# called workflow declaring the SAME group as its caller enters a group its own
# caller already holds and, with cancel-in-progress, cancels it: the run ends
# `failure` with zero jobs and no annotation, which reads as an invalid workflow
# file. That is the same self-cancellation this file's `issue_comment` note
# warns about, reached from the other direction. The caller is the only place
# that may serialize runs.

jobs:
  codex-review-window:
    # Draft PRs cannot merge, so skipping them is safe.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      # A `permissions:` block zeroes every scope it does not list, so each API
      # call needs its scope spelled out. Reading the head commit's timestamp
      # needs `contents`; the 👍 verdict lives on the issue-side reactions
      # endpoint; posting the review-request anchor needs `pull-requests: write`.
      # `issues: write` exists for exactly one write: the review-debt record.
      # On a round past the review budget the gate merges over open P1s, and a
      # finding that blocks nothing and is recorded nowhere is a finding
      # deleted — so the gate files ONE issue carrying the deferred findings
      # before it exits 0. It still writes no labels, posts no other issue,
      # and never reads an issue to AUTHORIZE anything (see the header: a
      # GITHUB_TOKEN comment cannot be attributed to a workflow, so nothing
      # here trusts one).
      #
      # `actions: read` exists for exactly one call: the waker probe, which asks
      # /actions/workflows/... for the waker's state to decide the verdict
      # window. Without it that endpoint answers 403, the probe fails soft, and
      # the gate takes the long window FOREVER — the probe's safe failure mode
      # silently disabling the optimization it guards. Observed live: the probe
      # logged `Resource not accessible by integration` on the very PR that
      # shipped it. Consumer stubs must grant this too, because a called
      # workflow's permissions cannot exceed its caller's.
      actions: read
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      CODEX_BOT: chatgpt-codex-connector[bot]
      ACTION: ${{ github.event.action }}
      # The gate posts its anchor with GITHUB_TOKEN, so only this identity may
      # own one. Anything else is someone else's comment wearing the marker.
      ANCHOR_AUTHOR: github-actions[bot]
      # Empty for fork PRs, where secrets are withheld — the alert is then
      # skipped and the gate still fails.
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      # A PAT for a GitHub account with a connected Codex Cloud subscription.
      #
      # SCOPE IT TO NOTHING BUT COMMENTING. This workflow runs from the PULL
      # REQUEST's copy of itself on a same-repository branch, and same-repo PRs
      # receive base-repository secrets — so anyone who can push a branch here
      # can add a step that prints this value. `permissions:` above does not
      # constrain it; that block governs GITHUB_TOKEN, not a PAT.
      #
      # Therefore: a FINE-GRAINED token, limited to these repositories, with
      # `Pull requests: Read and write` and nothing else. Stealing it then buys
      # the ability to write PR comments, which is noise. A classic token with
      # `repo` would hand over read/write on every private repository it covers.
      #
      # The right home for this is the App-owned controller, where the credential
      # never enters a PR-executed workflow at all:
      # an App-owned controller that holds the credential outside CI. Until
      # that exists, the narrow token is the containment.
      # Codex serves review requests per REQUESTING IDENTITY, and every
      # GITHUB_TOKEN comment is authored by `github-actions[bot]` — an identity
      # with no Codex account. It answers those with "To use Codex here, create
      # a Codex account and connect to github" within seconds and never
      # reviews. In one repository that silently blocked four PRs for six days
      # across thirteen requests: the gate posted, Codex refused, the gate
      # waited out its window and reported "no verdict arrived", which reads as
      # a flaky timeout rather than a request that was rejected outright.
      # Optional so a fork PR (secrets withheld) still runs; the gate then
      # depends on Codex Automatic Reviews, which fire on open/ready only.
      CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Lets the debounce below tell a first run from a waker-driven re-run.
      RUN_ATTEMPT: ${{ github.run_attempt }}
      # Quiet interval before the verdict lookup, so a burst of checkpoint pushes
      # costs one review generation instead of one each.
      DEBOUNCE_SECONDS: "90"
    steps:
      # One step that always runs and always decides. An `if:` on the gating step
      # would let the job report `skipped`, which branch protection counts as
      # SATISFIED — the failure mode this whole file exists to prevent.
      - name: Gate on Codex verdict for this commit
        run: |
          set -euo pipefail

          # ---------------------------------------------------------------
          # Fail-hard API wrapper. A `gh api ... || true` that swallows a 403, a
          # 502, or a jq compile error yields an EMPTY result, and an empty
          # finding list reads as "clean" — so an outage would open the gate.
          # Every read that feeds the verdict goes through this, which exits 1
          # (UNKNOWN) rather than returning nothing.
          #
          # `--paginate` runs the jq filter once PER PAGE, so callers must use
          # filters that emit one line per match and aggregate with wc/tail; a
          # filter ending in `length` or `last` emits one result per page.
          # ---------------------------------------------------------------
          api() {
            local out rc
            out=$(gh api --paginate "$@" 2>&1)
            rc=$?
            if [ ${rc} -ne 0 ]; then
              echo "::error::GitHub API call failed (rc=${rc}): gh api $* — the verdict for ${HEAD_SHA:-this head} is UNKNOWN, so the gate holds the merge. Re-run this job. Never treat an API failure as a clean review." >&2
              printf '%s\n' "${out}" | tail -5 >&2
              exit 1
            fi
            # Newline-TERMINATED when non-empty, and nothing at all when empty.
            # `printf '%s'` left the last line unterminated, so a caller piping
            # into `wc -l` counted one fewer than it matched: with exactly one
            # clean verdict comment — the ordinary case — the count came back 0
            # and the clean-verdict path never fired. Command substitution
            # strips the trailing newline anyway, and `tail`/`grep -c` are
            # indifferent to it, so every other caller is unaffected.
            if [ -n "${out}" ]; then
              printf '%s\n' "${out}"
            fi
          }

          # Count matching lines without letting grep's exit-1 (no match) be
          # mistaken for a pipeline failure.
          count_matches() {
            local pattern="$1" n
            n=$(grep -cE "${pattern}" || [ $? -eq 1 ])
            printf '%s' "${n:-0}"
          }

          # Re-read the head rather than trusting the event payload: this is what
          # lets the debounce below notice a head that moved mid-run.
          HEAD_SHA=$(api "repos/${REPO}/pulls/${PR}" --jq '.head.sha')
          if [ -z "${HEAD_SHA}" ]; then
            echo "::error::Could not resolve the head SHA for PR #${PR}. The verdict is UNKNOWN, so the gate holds the merge."
            exit 1
          fi
          echo "PR #${PR} head is ${HEAD_SHA} (action=${ACTION:-none})"

          HEAD_SHORT="$(printf '%s' "${HEAD_SHA}" | cut -c1-10)"
          ANCHOR="codex-review-window head ${HEAD_SHA}"
          # P0 **and** P1. Codex marks severity with its own badge — `P0 Badge`
          # / `badge/P0` — and does not necessarily add `[BLOCKER]`. A P1-only
          # pattern therefore read a P0-bearing review as marker-free and exited
          # 0: the most severe class of finding was the one that could merge.
          # Keep the two patterns in lockstep: the shell PATTERN and the jq
          # JQ_PATTERN below must always match the same set of bodies.
          PATTERN='\[BLOCKER\]|badge/P[01]|P[01] Badge'
          # Same regex for jq's test(), where a string literal needs the
          # backslashes doubled — `\[` alone is an invalid escape and jq refuses
          # to compile the program.
          JQ_PATTERN='\\[BLOCKER\\]|badge/P[01]|P[01] Badge'
          # The verbatim clean-verdict sentence. Defined here, next to the
          # patterns, because the round-state read below needs it before the
          # clean-signal helpers are declared. See the comment above
          # codex_clean_comment_for_head() for why the SENTENCE is required and
          # the marker test alone is not.
          CLEAN_VERDICT="Codex Review: Didn't find any major issues."

          # ---------------------------------------------------------------
          # Debounce. Wait IN-RUN, then re-read the head. If it moved, a newer
          # run exists and the concurrency group has cancelled or will cancel
          # this one — exit 1 regardless, because a skipped or neutral required
          # check SATISFIES branch protection and no later event would wake a
          # deferred one.
          # ---------------------------------------------------------------
          # A RE-RUN is never part of a push burst — it is the waker answering a
          # verdict that just landed, or a human retrying. Debouncing it would
          # pay 90 more seconds of runner time to re-read a head that this run
          # already read fresh from the API two lines above, and would delay the
          # answer the waker exists to deliver. The superseded-head check the
          # debounce also performs is not lost: with no sleep there is no window
          # for the head to move within, and HEAD_SHA is re-read on every run.
          if [ "${RUN_ATTEMPT:-1}" -gt 1 ]; then
            echo "Run attempt ${RUN_ATTEMPT}: skipping the debounce (a re-run is not a burst of pushes)."
          elif [ "${ACTION}" = "synchronize" ] && [ "${DEBOUNCE_SECONDS}" -gt 0 ]; then
            echo "Debouncing ${DEBOUNCE_SECONDS}s so a burst of pushes costs one review generation."
            sleep "${DEBOUNCE_SECONDS}"
            HEAD_NOW=$(api "repos/${REPO}/pulls/${PR}" --jq '.head.sha')
            if [ "${HEAD_NOW}" != "${HEAD_SHA}" ]; then
              echo "::error::Head moved ${HEAD_SHA} -> ${HEAD_NOW} during the debounce window. This run is superseded; the run for the new head decides. Failing rather than skipping, because a skipped required check would satisfy branch protection."
              exit 1
            fi
          fi

          HEAD_TIME=$(api "repos/${REPO}/commits/${HEAD_SHA}" --jq '.commit.committer.date')

          # Every Codex review of this exact commit, not just the newest: Codex
          # can post the auto-review AND a requested re-review against the same
          # head, and findings in either must hold the merge. This is THE verdict
          # read, so it fails hard — an API error returning nothing here would
          # look exactly like "Codex found no findings".
          review_ids_for_head() {
            api "repos/${REPO}/pulls/${PR}/reviews" \
              --jq "[.[] | select(.user.login == \"${CODEX_BOT}\" and .commit_id == \"${HEAD_SHA}\") | .id] | .[]"
          }

          # The marker is predictable, so ownership is what makes an anchor
          # usable: it must be authored by the workflow identity and never
          # edited. Without both checks, someone who can write comments could
          # collect Codex's 👍 on their own comment for a clean head, push a new
          # commit, and edit that comment to carry the new marker — the reaction
          # stays on the comment id and the unreviewed head reads clean.
          #
          # Note the limit of this trust model: it establishes "a workflow in
          # this repo wrote this", NOT "a particular workflow wrote this", since
          # every GITHUB_TOKEN actor is `github-actions[bot]`. That is sufficient
          # for an anchor (worst case: a re-review is requested twice) and NOT
          # sufficient to authorize anything, which is why no authorization
          # decision is made from a comment here.
          anchor_comment_id() {
            api "repos/${REPO}/issues/${PR}/comments" \
              --jq "[.[] | select(.user.login == \"${ANCHOR_AUTHOR}\") | select(.created_at == .updated_at) | select(.body | contains(\"${ANCHOR}\")) | .id] | .[]" \
              | tail -1
          }

          # Resolve who will ask Codex for the review. With a request token the
          # anchor is authored by THAT account, not by `github-actions[bot]`, so
          # ANCHOR_AUTHOR has to move with it — otherwise anchor_comment_id()
          # looks for the wrong author, never finds the anchor it just posted,
          # and requests a fresh review on every run.
          REQUEST_TOKEN="${CODEX_REQUEST_TOKEN:-}"
          if [ -n "${REQUEST_TOKEN}" ]; then
            REQUEST_LOGIN=$(GH_TOKEN="${REQUEST_TOKEN}" gh api user --jq '.login' 2>/dev/null || true)
            if [ -z "${REQUEST_LOGIN}" ]; then
              # Fail closed: a rotated or expired PAT would otherwise fall back
              # to the bot identity and reproduce the six-day silent stall.
              echo "::error::CODEX_REQUEST_TOKEN is set but does not authenticate — Codex would refuse a request from the fallback bot identity and this gate would time out without a verdict. Rotate the secret, or unset it to depend on Codex Automatic Reviews."
              exit 1
            fi
            ANCHOR_AUTHOR="${REQUEST_LOGIN}"
            echo "Review requests are posted as ${REQUEST_LOGIN} (a Codex-connected identity)."
          else
            echo "::warning::No CODEX_REQUEST_TOKEN is configured, so a review request would be posted as ${ANCHOR_AUTHOR}, which Codex refuses. Only Codex Automatic Reviews (PR opened / marked ready) can produce a verdict here; a verdict for a PUSHED head will never arrive and this gate will time out."
          fi

          # ---------------------------------------------------------------
          # Round state, computed statelessly from COMPLETED verdicts.
          #
          # A "reviewed head" is a head with a head-bound Codex verdict: a
          # formal review whose commit_id names it, or a clean-summary comment
          # carrying its full SHA. Request ANCHORS deliberately do not count —
          # an anchor proves a request was posted, not that review completed.
          # A push that cancels a pending run leaves an anchor with no verdict;
          # counting it would let base..old-head go unreviewed while the next
          # round reviews only old-head..new-head. Undercounting (a clean
          # signal that arrived only as a reaction, or a summary naming only a
          # short SHA) is the fail-safe direction: the delta base moves further
          # back and the degrade fires later.
          #
          # Both reads go through api(): they select the request text and the
          # blocking pattern, so a failed read must be UNKNOWN (exit 1), never
          # "round 1".
          VERDICT_LINES=$(
            api "repos/${REPO}/pulls/${PR}/reviews" \
              --jq "[.[] | select(.user.login == \"${CODEX_BOT}\") | \"\(.submitted_at) \(.commit_id)\"] | .[]"
            api "repos/${REPO}/issues/${PR}/comments" \
              --jq "[.[] | select(.user.login == \"${CODEX_BOT}\") | select(.body | contains(\"${CLEAN_VERDICT}\")) | select(.body | test(\"[0-9a-f]{40}\")) | \"\(.created_at) \(.body | capture(\"(?<s>[0-9a-f]{40})\").s)\"] | .[]"
          )
          # Oldest verdict first; one line per distinct prior head, the most
          # recently verdicted one last. NF==2 drops anything that is not a
          # "<timestamp> <sha>" record, so a mis-shaped row can only shrink the
          # count — never inflate it.
          PRIOR_HEADS=$(printf '%s\n' "${VERDICT_LINES}" | sort \
            | awk -v cur="${HEAD_SHA}" 'NF == 2 && $2 != cur && !seen[$2]++ {print $2}')
          REVIEWED_COUNT=$(printf '%s' "${PRIOR_HEADS}" | grep -c . || [ $? -eq 1 ])
          PREV_HEAD=$(printf '%s\n' "${PRIOR_HEADS}" | tail -1)
          ROUND=$((REVIEWED_COUNT + 1))
          # Overridable the same way as VERDICT_WINDOW_SECONDS: an undeclared
          # env var, not a workflow input — a consumer stub cannot loosen it.
          FULL_ROUNDS="${FULL_ROUNDS:-3}"
          DEGRADED=0
          if [ "${REVIEWED_COUNT}" -ge "${FULL_ROUNDS}" ]; then
            DEGRADED=1
          fi
          echo "Review round ${ROUND}: ${REVIEWED_COUNT} prior head(s) hold a completed verdict (budget: ${FULL_ROUNDS} full rounds)."

          # On degraded rounds only P0 holds the merge. [BLOCKER] is the P1 tag
          # in this fleet's review policy, so it is deliberately absent from
          # this pattern — including it would make the degrade a no-op for
          # prose-tagged P1s. No jq twin is needed: this pattern contains no
          # brackets and is consumed only by grep via count_matches. The
          # clean-signal jq keeps the FULL JQ_PATTERN in every round — a
          # summary claiming "no major issues" while carrying any badge stays
          # contradictory, and the blocking reading wins.
          P0_PATTERN='badge/P0|P0 Badge'
          ACTIVE_PATTERN="${PATTERN}"
          if [ "${DEGRADED}" -eq 1 ]; then
            ACTIVE_PATTERN="${P0_PATTERN}"
            echo "Degraded round ${ROUND}: only P0 findings hold the merge; P1s keep their badges for the batch fix but do not block."
          fi

          # Codex auto-reviews on open/ready but NOT on pushes, so ask for the
          # re-review — and leave the anchor behind either way. The request asks
          # for ONE comprehensive inventory: a bare "@codex review" returns
          # whatever surfaces on that pass, and each extra pass costs a full
          # review generation.
          ANCHOR_ID="$(anchor_comment_id)"
          ANCHOR_FAILED=0
          # `submitted` belongs here. A `pull_request_review` event starts a
          # replacement run and `cancel-in-progress` kills the synchronize run
          # that would have asked — so if a human review, or a review of a stale
          # head, lands during the 90s debounce, excluding `submitted` leaves
          # NOBODY having requested a verdict for the current head. The run then
          # waits out its window and fails, and the gate stays red until someone
          # pushes again or reruns by hand. The guard below already makes the
          # request idempotent, so including `submitted` costs nothing when the
          # synchronize run did get there first.
          case "${ACTION}" in
            synchronize|reopened|ready_for_review|submitted)
              if [ -z "${ANCHOR_ID}" ] && [ -z "$(review_ids_for_head)" ]; then
                # Three request shapes, one per round state. Round 1 keeps the
                # posted text byte-identical to CODEX_INVENTORY_REQUEST in
                # dev-agent's runner.py — the two are kept in sync deliberately.
                # Rounds >= 2 scope the review to the range since the last
                # COMPLETED verdict and require still-open prior findings to be
                # re-emitted with their badges, so an unresolved P1 on an
                # earlier head cannot vanish behind a clean delta. Degraded
                # rounds keep P1 badges too: Auto-fix selects findings by badge
                # and [BLOCKER] tag, so stripping badges would hide P1s from
                # the batch fix as well as from the gate.
                INVENTORY_TEXT='Return ONE comprehensive inventory of every P0/P1 in this diff, grouped by the root invariant each violates. For each finding give the affected symbol, every sibling consumer with the same defect, the failing input or call path, impact, confidence, a safe remediation path, and the regression test that would represent the class. Completeness on this pass matters more than brevity — a finding held back costs a full review generation. See "Code Review Rules" in AGENTS.md.'
                if [ -z "${PREV_HEAD}" ]; then
                  REQUEST_BODY=$(printf '@codex review\n\n%s\n\n<!-- %s -->' "${INVENTORY_TEXT}" "${ANCHOR}")
                elif [ "${DEGRADED}" -eq 0 ]; then
                  REQUEST_BODY=$(printf '@codex review\n\n%s\n\nHead %s of this pull request already has a completed review. Report the fixed/still-open status of every finding from your prior reviews, and RE-EMIT each still-open P0/P1 with its severity badge. For new findings, review the commit range %s..%s. If that range is not comparable (force-push), review the full diff.\n\n<!-- %s -->' "${INVENTORY_TEXT}" "${PREV_HEAD}" "${PREV_HEAD}" "${HEAD_SHA}" "${ANCHOR}")
                else
                  REQUEST_BODY=$(printf '@codex review\n\nRound %s exceeds the full-review budget for this pull request. Review ONLY the commit range %s..%s (the full diff if that range is not comparable after a force-push). Report P0 findings with their P0 badge, and RE-EMIT any still-open prior P0 likewise. Report P1s — new or still open — under a heading named Non-blocking notes, KEEPING their severity badges: they will be batch-fixed but do not hold the merge on this round.\n\n<!-- %s -->' "${ROUND}" "${PREV_HEAD}" "${HEAD_SHA}" "${ANCHOR}")
                fi
                # `|| true` on its own is not enough here. On a failed request
                # gh prints the API's error body to STDOUT, so the assignment
                # succeeds with a non-empty value that is not an id: a 403 was
                # reported as `Posted ... (comment {"message":"Resource not
                # accessible by personal access token"...})`, the run then waited
                # out its full window, and the log blamed Codex connectivity for
                # a token-scope problem. Require BOTH a zero exit and a bare
                # integer before believing a comment exists.
                REQ_RC=0
                REQ_OUT=$(GH_TOKEN="${REQUEST_TOKEN:-${GH_TOKEN}}" \
                  gh api "repos/${REPO}/issues/${PR}/comments" \
                  -f body="${REQUEST_BODY}" \
                  --jq '.id' 2>&1) || REQ_RC=$?
                case "${REQ_OUT}" in
                  ''|*[!0-9]*) ANCHOR_ID='' ;;
                  *)           ANCHOR_ID="${REQ_OUT}" ;;
                esac
                [ ${REQ_RC} -ne 0 ] && ANCHOR_ID=''
                # Gate the hard failure on a REJECTED request (non-zero exit),
                # not merely on an absent id. A zero exit that yields no id is a
                # different and vaguer state, and the conservative fallback
                # below — no anchor, still red for want of a verdict — remains
                # the right answer for it.
                if [ ${REQ_RC} -ne 0 ] && [ -n "${REQUEST_TOKEN}" ]; then
                  # The identity authenticated (checked above) but cannot
                  # comment. That is a misconfiguration, not a fork PR, and no
                  # verdict for a pushed head can ever arrive — so fail now
                  # instead of holding the merge for the full window and
                  # presenting as a Codex outage.
                  echo "::error::CODEX_REQUEST_TOKEN authenticates but cannot post the review request on ${REPO} (rc=${REQ_RC}): ${REQ_OUT}. A pull request's conversation comments are ISSUE comments in the REST API, so a fine-grained token needs 'Issues: Read and write'; 'Pull requests: Read and write' alone returns 403 here. Widen the token's permissions for this repository, or unset the secret to depend on Codex Automatic Reviews."
                  exit 1
                fi
                if [ -n "${ANCHOR_ID}" ]; then
                  echo "Posted an inventory-scoped '@codex review' (comment ${ANCHOR_ID}) anchored to this head."
                else
                  # Fork PRs get a read-only GITHUB_TOKEN, so the anchor cannot
                  # be created. Head-bound signals that need no anchor — a review
                  # for this commit, or a summary comment naming it — still
                  # apply; only a bare 👍 becomes unusable.
                  ANCHOR_FAILED=1
                  echo "::warning::Could not post the anchor comment (read-only token, likely a fork PR). Falling back to head-bound signals: a Codex review of this commit, or a summary comment naming it."
                fi
              fi
              ;;
          esac

          # A requested re-review that finds nothing comes back as an issue
          # comment — "Codex Review: Didn't find any major issues ... Reviewed
          # commit: <sha>" — not as a review and not as a reaction. That body
          # names the commit, so it is bound to this head.
          #
          # The VERDICT SENTENCE IS REQUIRED, not merely the absence of a
          # severity marker. Codex posts other head-naming comments — quota
          # notices, "review failed" errors, progress updates — that carry no
          # marker either; matching on "names the commit and looks unalarming"
          # promoted every one of them to an approval. Only the sentence below
          # actually asserts that the diff was reviewed and found clean. The
          # marker test stays as a second condition: a body that both claims no
          # major issues and carries a P0/P1 badge is contradictory, and the
          # blocking reading is the safe one. (CLEAN_VERDICT is defined up with
          # the verdict patterns, where the round-state read also needs it.)
          codex_clean_comment_for_head() {
            api "repos/${REPO}/issues/${PR}/comments" \
              --jq "[.[] | select(.user.login == \"${CODEX_BOT}\") | select(.body | contains(\"${CLEAN_VERDICT}\") and contains(\"${HEAD_SHORT}\")) | select(.body | test(\"${JQ_PATTERN}\") | not) | .id] | .[]" \
              | wc -l | tr -d ' '
          }

          # The reaction lookups below deliberately keep the raw `gh api ... ||
          # true` form rather than going through api(). They produce a CLEAN
          # signal, so a swallowed failure yields 0 — "no verdict" — which falls
          # through to the fail-closed timeout. Failing toward blocking is the
          # safe direction here, and a deleted anchor legitimately 404s.
          codex_clean_for_head() {
            if [ "$(codex_clean_comment_for_head)" -gt 0 ]; then
              echo 1
              return
            fi
            if [ -n "${ANCHOR_ID}" ]; then
              gh api "repos/${REPO}/issues/comments/${ANCHOR_ID}/reactions" --paginate \
                --jq "[.[] | select(.user.login == \"${CODEX_BOT}\" and .content == \"+1\") | .id] | .[]" \
                2>/dev/null | wc -l | tr -d ' ' || true
              return
            fi
            if [ "${ACTION}" = "opened" ]; then
              gh api "repos/${REPO}/issues/${PR}/reactions" --paginate \
                --jq "[.[] | select(.user.login == \"${CODEX_BOT}\" and .content == \"+1\" and .created_at > \"${HEAD_TIME}\") | .id] | .[]" \
                2>/dev/null | wc -l | tr -d ' ' || true
              return
            fi
            echo 0
          }

          # ---------------------------------------------------------------
          # SHORT window, not a long one. A runner is billed for every second
          # it is held, and a 900s window spent in `sleep 20` was 424 billed
          # minutes across four repositories in a single day — 263 of them in
          # runs that `cancel-in-progress` killed mid-sleep, so the wait was
          # paid for and then thrown away.
          #
          # The window no longer has to cover Codex's whole turnaround, because
          # a verdict that arrives after it now RE-ENTERS the gate instead of
          # having to be caught by a poll that was already running:
          #   * a formal review fires `pull_request_review: submitted`, which
          #     this workflow already listens to (see the header);
          #   * a clean-summary comment fires `issue_comment`, which this
          #     workflow deliberately CANNOT listen to — a comment event runs
          #     from the default branch, so its check run is bound to the wrong
          #     SHA and can never satisfy the PR's required check. The waker in
          #     `codex-verdict-waker.yml` listens instead and RE-RUNS the
          #     PR-bound run for this head, which reports against the right SHA.
          #
          # So the window covers only the fast path — a verdict already in hand,
          # or one landing within a couple of minutes — and everything slower is
          # handled by re-entry. It is still a real wait, not zero: exiting
          # instantly would fail the check on every push and make the PR flap red
          # before the waker could answer.
          #
          # What re-entry does NOT cover is a bare 👍 REACTION, because reactions
          # fire no webhook event of any kind. A reaction-only verdict landing
          # after this window needs a manual re-run, and the no-verdict error
          # below says so.
          #
          # THE SHORT WINDOW IS EARNED, NOT ASSUMED. An `issue_comment` workflow
          # runs only when its file exists on the DEFAULT branch — so on the very
          # pull request that installs the waker (and on every repository whose
          # bootstrap PR ships both stubs together), the waker cannot fire yet.
          # Shortening the window there strands a comment-shaped verdict with
          # nothing to re-enter the gate. So the gate checks whether the waker
          # is deployed where events can actually reach it, and keeps the old
          # long window until it is. Failure direction: if this probe errors
          # (rate limit, outage), the gate assumes NO waker and takes the long
          # window — the pre-waker behaviour that was merely expensive, never
          # unsafe. That is why this read deliberately does NOT go through the
          # fail-hard api() wrapper: it selects a wait length, not a verdict.
          # The probe asks the Actions API for the WORKFLOW, not the Contents API
          # for the file: a workflow that was disabled in the UI, or that never
          # registered because it only exists on a topic branch, still has a
          # file — and a file cannot wake anything. Only `state: active` means
          # events will actually start it. (An active workflow whose triggers
          # have drifted is a different failure, and the consumer's design lock
          # is what pins the stub's bytes against that.)
          #
          # `state: active` is necessary and NOT sufficient, and the paragraph
          # above says why without following it through: it defers a drifted
          # trigger to "the consumer's design lock pins the stub's bytes". That
          # holds for every consumer — and not for THIS repository, the one
          # consumer that never installed a stub, where the path resolves to
          # the reusable HOST (`on: workflow_call`). A host is `active` and can
          # never be started by an event, so the probe read it as a waker and
          # handed this repository the worst pair available: the short window
          # with no re-entry at all. Every clean verdict here then needed a
          # manual re-run. So the trigger is checked directly, on the DEFAULT
          # branch, because that is the only ref an `issue_comment` workflow
          # ever runs from. Comments are stripped first: this file's own header
          # says `issue_comment` a dozen times in prose, and matching that
          # would re-admit the exact confusion being removed.
          WAKER_STATE=$(gh api "repos/${REPO}/actions/workflows/codex-verdict-waker.yml" \
            --jq '.state' 2>/dev/null || true)
          WAKER_FILE=$(gh api "repos/${REPO}/contents/.github/workflows/codex-verdict-waker.yml" \
            -H "Accept: application/vnd.github.raw" 2>/dev/null || true)
          WAKER_TRIGGERED=0
          if printf '%s' "${WAKER_FILE}" | sed 's/#.*//' \
            | grep -qE '(^[[:space:]]+issue_comment:|^on:.*\[.*issue_comment)'; then
            WAKER_TRIGGERED=1
          fi
          WAKER_DEPLOYED=0
          [ "${WAKER_STATE}" = "active" ] && [ "${WAKER_TRIGGERED}" -eq 1 ] && WAKER_DEPLOYED=1
          if [ "${WAKER_DEPLOYED}" -eq 1 ]; then
            WINDOW="${VERDICT_WINDOW_SECONDS:-120}"
            echo "The verdict waker is active in this repository; late verdicts re-enter, so the in-run window is ${WINDOW}s."
          else
            WINDOW="${VERDICT_WINDOW_SECONDS:-900}"
            echo "No active verdict waker in this repository (state: ${WAKER_STATE:-absent}, issue_comment trigger: ${WAKER_TRIGGERED}) — a comment-shaped verdict cannot re-enter the gate, so the in-run window stays ${WINDOW}s. Merging the waker stub shortens it."
          fi
          DEADLINE=$((SECONDS + WINDOW))
          RIDS=""
          CLEAN=0
          # Check-at-least-once, deliberately not `while [ SECONDS -lt DEADLINE ]`.
          # A pre-test on the deadline means a zero or misconfigured window skips
          # the verdict lookup ENTIRELY and falls through to the no-verdict path —
          # the gate would report "Codex never answered" without ever asking.
          while :; do
            RIDS="$(review_ids_for_head)"
            [ -n "${RIDS}" ] && break
            CLEAN="$(codex_clean_for_head)"
            CLEAN="${CLEAN:-0}"
            [ "${CLEAN}" -gt 0 ] && break
            [ ${SECONDS} -ge ${DEADLINE} ] && break
            sleep 20
          done

          # Fail closed. A silent pass on timeout is what let three consecutive PRs
          # merge with open P1s: the verdict was still in flight, not
          # favourable. Absence of a verdict is not approval.
          if [ -z "${RIDS}" ] && [ "${CLEAN}" -eq 0 ]; then
            if api "repos/${REPO}/issues/${PR}/comments" \
                 --jq ".[] | select(.user.login == \"${CODEX_BOT}\") | .body" \
                 | grep -q "reached your Codex usage limits"; then
              # A quota outage freezes every merge behind this gate, and the only
              # visible symptom is a red check on an unrelated PR — so say it out
              # loud. That state once went unnoticed for three days and
              # eleven PRs merged unreviewed. Trimming guards against a webhook
              # stored with a trailing newline, which curl rejects as a malformed
              # URL; report the real HTTP status rather than claiming delivery.
              HOOK=$(printf '%s' "${SLACK_WEBHOOK}" | tr -d '[:space:]')
              if [ -n "${HOOK}" ]; then
                CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
                  -H 'Content-type: application/json' \
                  --data "$(jq -nc --arg text "⚠️ Codex review quota exhausted — merges are blocked. PR #${PR} (${HEAD_SHA}) is unreviewed and codex-review-window fails closed. Restore quota at https://chatgpt.com/codex/cloud/settings/usage, then re-run: ${RUN_URL}" '{text: $text}')" \
                  "${HOOK}") || CODE="curl-error"
                echo "Slack responded: ${CODE}"
              else
                echo "No SLACK_WEBHOOK available; skipping the alert."
              fi
              echo "::error::Codex is out of review quota for this repo, so ${HEAD_SHA} is unreviewed. Restore quota and re-run this job. Do NOT push a commit hoping to shake a verdict loose."
              exit 1
            fi
            PR_LEVEL=$(gh api "repos/${REPO}/issues/${PR}/reactions" --paginate \
              --jq "[.[] | select(.user.login == \"${CODEX_BOT}\" and .content == \"+1\") | .id] | .[]" \
              2>/dev/null | wc -l | tr -d ' ' || true)
            if [ "${PR_LEVEL}" -gt 0 ]; then
              echo "::notice::Codex holds a PR-level 👍, but a reaction carries no commit id and cannot be attributed to ${HEAD_SHA}, so it is not accepted as this head's verdict. Re-run this job once Codex answers for this commit."
            fi
            if [ "${ANCHOR_FAILED}" -eq 1 ]; then
              echo "::error::No Codex verdict for ${HEAD_SHA} within ${WINDOW}s, and this run could not request one — the token is read-only, which is normal for a fork PR. The verdict is UNKNOWN, so the gate holds the merge. A maintainer can comment '@codex review' on the PR; a formal review re-enters this gate on its own."
              exit 1
            fi
            # The operator instruction must match what will actually happen,
            # which depends on the waker. WITH an active waker, re-entry is
            # automatic for every event-shaped verdict, and telling an operator
            # to re-run by hand would train the one habit that defeats the
            # gate: re-running a genuine BLOCK until it flakes green. WITHOUT
            # one, only a formal review can re-enter — a comment-shaped verdict
            # has no event path back here, and claiming it does leaves the PR
            # red with an operator waiting on a promise nothing will keep.
            if [ "${WAKER_DEPLOYED}" -eq 1 ]; then
              echo "::error::No Codex verdict for ${HEAD_SHA} within ${WINDOW}s — neither a review nor a 👍. The verdict is UNKNOWN, so the gate holds the merge. This is EXPECTED while Codex is still reviewing: a review or a clean summary re-opens this gate automatically, so wait rather than pushing a commit to shake a verdict loose. Two cases do need a hand: a verdict delivered ONLY as a 👍 reaction (reactions fire no event, so nothing can re-enter — re-run this job), and a repo genuinely not connected to Codex Cloud (disconnect this required check in branch protection rather than opening a repo-wide bypass here)."
            else
              echo "::error::No Codex verdict for ${HEAD_SHA} within ${WINDOW}s — neither a review nor a 👍. The verdict is UNKNOWN, so the gate holds the merge. This repository has NO active verdict waker, so only a FORMAL review re-enters this gate by itself; a clean-summary comment will not. When the verdict arrives, re-run this job — or better, merge the codex-verdict-waker stub so re-entry is automatic. Do not push a commit to shake a verdict loose."
            fi
            exit 1
          fi

          # ---------------------------------------------------------------
          # Deliberate bypass 1 of 2: a clean head-bound signal, no review.
          #
          # The loop above breaks the instant a clean signal appears, and a
          # formal review is routinely PUBLISHED MOMENTS AFTER the summary
          # comment or 👍 that announces it. Exiting 0 straight off the clean
          # signal therefore re-runs the race this file exists to lose no more:
          # in the motivating incident the review landed 59s after the gate had already
          # decided. Wait, then re-query — a review found now is authoritative
          # and the clean signal does not override it.
          # ---------------------------------------------------------------
          # POLL across the whole window rather than checking once at the end.
          # A single `sleep 15` was shorter than the lag recorded two lines above:
          # the review landed 59 seconds later, so the one recheck
          # found nothing, the gate exited 0, and auto-merge consumed the green
          # check before the P1s were published. A grace shorter than the lag it
          # cites is not a grace.
          #
          # 90s covers the observed 59s with room, and the poll returns the
          # instant a review appears — so only a genuinely clean head pays the
          # full window.
          if [ -z "${RIDS}" ]; then
            GRACE="${GRACE_SECONDS:-90}"
            GRACE_DEADLINE=$((SECONDS + GRACE))
            while :; do
              RIDS="$(review_ids_for_head)"
              [ -n "${RIDS}" ] && break
              [ ${SECONDS} -ge ${GRACE_DEADLINE} ] && break
              sleep 5
            done
            if [ -n "${RIDS}" ]; then
              echo "A formal review for ${HEAD_SHA} arrived during the ${GRACE}s grace window; it overrides the clean signal."
            else
              echo "No formal review for ${HEAD_SHA} within ${GRACE}s of the clean signal."
            fi
          fi

          if [ -z "${RIDS}" ]; then
            echo "Codex reports no findings for ${HEAD_SHA}."
            exit 0
          fi

          # Give inline finding comments a moment to finish landing.
          sleep "${SETTLE_SECONDS:-15}"

          INLINE=0
          BODY=0
          # ACTIVE_PATTERN, not PATTERN: on degraded rounds only P0 markers
          # hold the merge here. P1 badges still land on the PR for the batch
          # fix; they just stop deciding this check.
          for RID in ${RIDS}; do
            HITS=$(api "repos/${REPO}/pulls/${PR}/comments" \
              --jq ".[] | select(.pull_request_review_id == ${RID}) | .body" \
              | count_matches "${ACTIVE_PATTERN}")
            INLINE=$((INLINE + HITS))
            # Through api() as well: a body-only finding is the one form with no
            # inline comment to fall back on, so dropping it would lose a blocker.
            HITS=$(api "repos/${REPO}/pulls/${PR}/reviews/${RID}" --jq '.body' \
              | count_matches "${ACTIVE_PATTERN}")
            BODY=$((BODY + HITS))
          done

          if [ "$((INLINE + BODY))" -gt 0 ]; then
            if [ "${DEGRADED}" -eq 1 ]; then
              # A P0 stuck past the review budget is not routine red: the PR
              # has burned its rounds and is now held on a data-loss-class
              # finding — say it where a human looks, the same way the quota
              # outage is announced. Alert failure changes nothing: the exit 1
              # below already holds the merge.
              HOOK=$(printf '%s' "${SLACK_WEBHOOK}" | tr -d '[:space:]')
              if [ -n "${HOOK}" ]; then
                CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
                  -H 'Content-type: application/json' \
                  --data "$(jq -nc --arg text "🛑 PR #${PR} (${HEAD_SHA}) carries a P0 past the review budget (round ${ROUND}) — the merge is held and no further round will soften it. A human decision is needed: ${RUN_URL}" '{text: $text}')" \
                  "${HOOK}") || CODE="curl-error"
                echo "Slack responded: ${CODE}"
              fi
              echo "::error::Codex review reports P0 finding(s) on ${HEAD_SHA} (inline: ${INLINE}, body: ${BODY}) on degraded round ${ROUND} — P1s no longer hold the merge here, so these are P0s. Fix the invariant rather than the reported instance. A human can stop automation by applying the 'needs-human' label."
              exit 1
            fi
            echo "::error::Codex review reports P0/P1/[BLOCKER] finding(s) on ${HEAD_SHA} (inline: ${INLINE}, body: ${BODY}). Fix the invariant rather than the reported instance — audit every sibling consumer of the affected contract in the same batch, because each additional round costs a full review generation. A human can stop automation by applying the 'needs-human' label."
            exit 1
          fi

          # ---------------------------------------------------------------
          # Review debt. On a degraded round the scan above counted only P0s,
          # so reaching here can mean "no findings at all" or "P1s that no
          # longer block". The second case merges a PR with findings open, and
          # a finding that blocks nothing and is recorded NOWHERE is a finding
          # deleted — the PR closes, the threads fall out of every queue, and
          # the debt silently becomes permanent. So before the exit 0, re-scan
          # with the FULL pattern and file the deferred findings as ONE issue.
          #
          # Fail-soft throughout, and deliberately NOT through api(): the
          # merge decision is already made — P0s were counted above and there
          # are none — so a failure here may cost the record, never the merge.
          # Holding the PR red because a bookkeeping write hiccuped would
          # reintroduce the exact cost the round budget exists to cap. The
          # fail-hard sweep test allowlists these reads by the same reasoning
          # as the identity and waker probes: they feed no verdict.
          # ---------------------------------------------------------------
          if [ "${DEGRADED}" -eq 1 ] && [ -n "${RIDS}" ]; then
            # ONE ISSUE PER FINDING, not one per pull request. A bundle is
            # either open or closed for everything in it, so a single fixed
            # finding cannot be retired without either closing its unfixed
            # siblings or leaving the issue open as a permanent reminder of
            # nothing in particular. Per-finding issues are also what the trunk
            # review already files, so this makes the fleet's two finding
            # producers behave the same way rather than adding a third shape.
            #
            # Records are tab-separated because a finding's title is model
            # prose and may contain anything except a tab or a newline.
            DEBT=""
            for RID in ${RIDS}; do
              INLINE_DEBT=$(gh api --paginate "repos/${REPO}/pulls/${PR}/comments" \
                --jq ".[] | select(.pull_request_review_id == ${RID}) | select(.body | test(\"${JQ_PATTERN}\")) | .path + \"\t\" + .html_url + \"\t\" + (.body | split(\"\n\")[0])" \
                2>/dev/null || true)
              DEBT="${DEBT}${INLINE_DEBT}"$'\n'
              REVIEW_BODY=$(gh api "repos/${REPO}/pulls/${PR}/reviews/${RID}" --jq '.body' 2>/dev/null || true)
              if printf '%s' "${REVIEW_BODY}" | grep -qE "${PATTERN}"; then
                BODY_DEBT=$(printf '%s' "${REVIEW_BODY}" | grep -E "${PATTERN}" | head -1)
                DEBT="${DEBT}review body"$'\t'"https://github.com/${REPO}/pull/${PR}#pullrequestreview-${RID}"$'\t'"${BODY_DEBT}"$'\n'
              fi
            done
            if printf '%s' "${DEBT}" | grep -q '\S'; then
              # ONE listing for every finding. Per-finding lookups would cost N
              # paginated reads and, worse, N chances for the lookup to fail
              # halfway through and leave the batch half-recorded. The failure
              # is preserved rather than swallowed into an empty result: an
              # empty title list born from a 403 or 5xx reads as "nothing filed
              # yet" and would duplicate every finding on the next degraded
              # round.
              # `VAR=$(cmd)` under `set -e` EXITS when cmd fails, which would
              # turn a bookkeeping outage into a held merge — the one thing
              # this whole block must never do. Seed the rc and capture it on
              # the `||` branch, exactly as the per-PR lookup did.
              DEBT_LOOKUP_RC=0
              OPEN_TITLES=$(gh api --paginate "repos/${REPO}/issues?state=open&per_page=100" \
                --jq '.[] | select(.pull_request == null) | .title' 2>/dev/null) || DEBT_LOOKUP_RC=$?
              if [ "${DEBT_LOOKUP_RC}" -ne 0 ]; then
                echo "::warning::Could not list open issues (rc=${DEBT_LOOKUP_RC}); writing nothing rather than risking a duplicate. The findings above merge unrecorded — file them by hand."
              else
                FILED=0
                SKIPPED=0
                while IFS=$'\t' read -r DEBT_PATH DEBT_URL DEBT_LINE; do
                  [ -n "${DEBT_LINE}" ] || continue
                  # A title has to survive being read in a list, so strip the
                  # badge image markdown and the bold markers Codex wraps a
                  # finding in, and bound the length. What remains is the
                  # finding's own sentence, which is also the dedup key.
                  DEBT_NAME=$(printf '%s' "${DEBT_LINE}" \
                    | sed -E 's/!\[[^]]*\]\([^)]*\)//g; s/\*\*//g; s/\[BLOCKER\]//g; s/^[[:space:]]+//; s/[[:space:]]+$//; s/[[:space:]]+/ /g' \
                    | cut -c1-180)
                  [ -n "${DEBT_NAME}" ] || DEBT_NAME="finding in ${DEBT_PATH}"
                  DEBT_TITLE="[review-debt] ${DEBT_NAME}"
                  if printf '%s\n' "${OPEN_TITLES}" | grep -qxF "${DEBT_TITLE}"; then
                    SKIPPED=$((SKIPPED + 1))
                    continue
                  fi
                  DEBT_BODY=$(printf 'Round %s of PR #%s exceeded the review budget (%s full rounds), so this still-open finding no longer holds the merge and the PR merged over it. It is recorded here so the debt survives the PR.\n\nPR: #%s\nHead: %s\nFile: %s\nFinding: %s\n\n%s\n\nFix the invariant, not the instance — see AGENTS.md.' \
                    "${ROUND}" "${PR}" "${FULL_ROUNDS}" "${PR}" "${HEAD_SHA}" "${DEBT_PATH}" "${DEBT_URL}" "${DEBT_LINE}")
                  # `</dev/null` because this runs inside a `read` loop: a
                  # child that touched stdin would eat the remaining findings.
                  if gh api "repos/${REPO}/issues" -f title="${DEBT_TITLE}" -f body="${DEBT_BODY}" </dev/null >/dev/null 2>&1; then
                    FILED=$((FILED + 1))
                    # The snapshot was taken before the loop, so a title filed
                    # INSIDE it is not in it. One degraded round walks several
                    # reviews and a still-open finding is re-emitted in each,
                    # so the same normalized title recurs within one batch —
                    # dedup has to cover the batch, not just the repository as
                    # it stood when the loop started. (The `while` reads a
                    # here-string, not a pipe, so this assignment survives the
                    # iteration.)
                    OPEN_TITLES="${OPEN_TITLES}"$'\n'"${DEBT_TITLE}"
                  else
                    echo "::warning::Could not file review debt for: ${DEBT_TITLE}. It merges unrecorded — file it by hand."
                  fi
                done <<< "${DEBT}"
                echo "Review debt for ${HEAD_SHORT}: filed ${FILED}, already open ${SKIPPED}."
              fi
            fi
          fi

          # ---------------------------------------------------------------
          # Deliberate bypass 2 of 2: a head-bound review with no BLOCKING
          # marker — P0/P1 on full rounds, P0 only once the budget is spent
          # (with the P1s just recorded as review debt above).
          # ---------------------------------------------------------------
          echo "Codex review is green for ${HEAD_SHA}."
          exit 0
