name: codex-verdict-waker
# Re-enters `codex-review-window` when a Codex verdict arrives as a COMMENT.
#
# WHY THIS FILE EXISTS
# --------------------
# The gate used to hold a runner for up to 900 seconds waiting for a verdict,
# nearly all of it in `sleep 20`. That was 424 billed minutes across four
# repositories in one day, 263 of which were burned by runs that
# `cancel-in-progress` killed mid-sleep — paid for, then discarded. The gate's
# window is now short (120s), which is only safe if a verdict landing after it
# can re-open the gate by itself.
#
# Two of the three verdict shapes already can, or now can:
#   * a formal review fires `pull_request_review: submitted`, which the gate
#     itself listens to;
#   * a clean-summary comment fires `issue_comment` — and this workflow turns
#     that into a re-run of the gate.
# The third, a bare 👍 REACTION, fires no webhook event at all and cannot be
# covered by any workflow trigger. The gate's no-verdict error names that case
# and asks for a manual re-run.
#
# WHY IT RE-RUNS RATHER THAN GATING
# ---------------------------------
# The gate cannot simply add `issue_comment` to its own `on:` block, for two
# independent reasons documented at length in `codex-review-window.yml`: a
# comment event runs from the DEFAULT BRANCH, so its check run is bound to the
# default-branch SHA and can never satisfy the pull request's required check;
# and the consumer stub's concurrency group is keyed on the PR number, so a
# comment-triggered run would cancel the real PR-associated run.
#
# Re-running the PR-bound run sidesteps both. This workflow is not a required
# check, so where its own check run lands is irrelevant; and the run it starts
# is a new ATTEMPT of the original `pull_request` run, which reports the
# `codex-review-window / codex-review-window` context against the pull
# request's head commit — the SHA branch protection is actually waiting on.
#
# WHY IT TARGETS A RUN BY HEAD SHA
# --------------------------------
# A re-run reports against the head commit of the run it re-runs, NOT against
# whatever the pull request's head is now. Re-running a stale run would post a
# green check against a commit nobody is merging while the current head stays
# unreviewed. So this workflow re-runs a run only when that run's `head_sha`
# still equals the pull request's head. If the head has moved on, the push that
# moved it started its own gate run and that run is the one that decides;
# there is nothing to wake.
# `workflow_call` only: the triggering events fire in the CONSUMER repository,
# so the consumer installs a one-screen stub carrying them and calls this body —
# the same host/stub split as the gate itself, for the same reason: the logic
# reviewed once, where its tests are. The `github.event` context a called
# workflow sees is the CALLER's event, so the guards below read the comment or
# the review exactly as if the triggers were declared here.
#
# TWO events, because a Codex verdict arrives in two shapes and BOTH can leave a
# stale failed gate run behind:
#
#   * `issue_comment` — a clean-summary comment. The gate cannot listen to this
#     itself (a comment event runs from the default branch, so its check run is
#     bound to the wrong SHA), which is the original reason this workflow exists.
#
#   * `pull_request_review` — a formal review. The gate DOES listen to this and
#     starts a fresh run, so re-entry was thought to be covered. It is not: the
#     fresh run is a NEW check run, and the earlier run that failed for want of
#     a verdict stays on the commit. GitHub's status rollup counts that stale
#     failure, so the pull request reports BLOCKED while a newer run of the same
#     context sits green beside it. Observed four times on 2026-08-31, each
#     cleared only by re-running the stale run BY HAND — which is precisely the
#     work this workflow exists to do.
on:
  workflow_call:

# NO `concurrency:` HERE — the CALLER owns the group, exactly as with the gate:
# a callee declaring the same group as its caller enters a group its own caller
# holds and, with cancel-in-progress, cancels it. The stub keys its group on
# the PR number — its OWN group, never the gate's, which would be the
# self-cancellation trap the gate's header warns about.

jobs:
  wake:
    # One guard per event shape. Neither grants any authority — the gate
    # re-reads every verdict itself and trusts only CODEX_BOT-authored
    # artifacts — they only stop arbitrary chatter from spending a runner.
    #
    # comment path: `issue_comment` fires for plain issues too (an issue has no
    #   head commit and no gate run), and Codex posts progress updates and quota
    #   notices that name no verdict; waking on those re-runs a gate that will
    #   only find the same absence.
    # review path: any Codex-authored review is a completed verdict by
    #   definition, so no body test is needed or wanted — a review carrying
    #   findings is exactly the case where the stale failure must be cleared.
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
       contains(github.event.comment.body, 'Codex Review')) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.user.login == 'chatgpt-codex-connector[bot]')
    runs-on: ubuntu-latest
    # A few API reads, a bounded wait on an in-flight gate run, and one
    # serialized re-run per stale gate run, each waiting at most
    # WAKER_RECHECK_SECONDS (240s) for its predecessor. A gate run takes ~1-2
    # minutes now, so the ordinary drain is far under this cap; the timeout is
    # the outer bound that keeps a waker from ever hanging.
    timeout-minutes: 30
    permissions:
      # `actions: write` is the whole point — it is what allows the re-run.
      # `pull-requests: read` reads the head SHA. Nothing else: this workflow
      # posts no comment, sets no status, and writes no code.
      actions: write
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      # `issue_comment` carries the PR as an issue; `pull_request_review`
      # carries it as a pull request. Exactly one is ever set.
      PR: ${{ github.event.issue.number || github.event.pull_request.number }}
      GATE_WORKFLOW: codex-review-window.yml
    steps:
      - name: Re-run the gate for this pull request's head
        run: |
          set -euo pipefail

          # This job decides nothing about mergeability — it only asks the gate
          # to look again. So, unlike the gate, a failed read here must NOT hold
          # anything: it just means no wake happened, and the pull request stays
          # red until the next event or a manual re-run. Fail loudly, change
          # nothing.
          PR_JSON=$(gh api "repos/${REPO}/pulls/${PR}")
          HEAD_SHA=$(printf '%s' "${PR_JSON}" | jq -r '.head.sha')
          DRAFT=$(printf '%s' "${PR_JSON}" | jq -r '.draft')
          STATE=$(printf '%s' "${PR_JSON}" | jq -r '.state')

          if [ "${STATE}" != "open" ] || [ "${DRAFT}" = "true" ]; then
            echo "PR #${PR} is ${STATE}${DRAFT:+, draft=${DRAFT}} — the gate does not run on it. Nothing to wake."
            exit 0
          fi
          echo "PR #${PR} head is ${HEAD_SHA}."

          # Newest first, and filtered to THIS head. `head_sha` is the field that
          # matters, not `head_branch`: a re-run reports against the run's own
          # head commit, so a run for a superseded commit is worse than useless.
          RUN_JSON=$(gh api \
            "repos/${REPO}/actions/workflows/${GATE_WORKFLOW}/runs?head_sha=${HEAD_SHA}&per_page=100" \
            --jq '[.workflow_runs[] | {id, status, conclusion, attempt: .run_attempt}]')

          # EVERY completed non-green run, not just the newest. A newer
          # SUCCESS does not retire an older failure: both check runs stay on
          # the commit, GitHub's rollup counts the failure, and the pull
          # request reports BLOCKED with a green run sitting beside the red
          # one. Selecting only `.[0]` left exactly that state behind whenever
          # the gate's own `pull_request_review` re-entry produced the newer
          # run — the bug this workflow was extended to close.
          #
          # `status == completed` is required: an in-progress run needs no wake
          # (it is inside its own verdict window) and asking to re-run one
          # returns 403.
          stale_runs() {
            printf '%s' "$1" \
              | jq -r 'map(select(.status == "completed" and .conclusion != "success")) | .[].id'
          }

          TARGETS="$(stale_runs "${RUN_JSON}")"

          RUNNING=$(printf '%s' "${RUN_JSON}" | jq -r 'map(select(.status != "completed")) | length')
          if [ "${RUNNING}" -gt 0 ]; then
            # An in-flight run USUALLY sees the verdict itself — its poll is
            # still cycling — but not always: a verdict landing after the run's
            # deadline expired, while it walks its no-verdict exit path, is
            # invisible to it, and once it fails there is no later event to
            # wake it. That interleaving is narrow but it strands the PR red.
            # And on the review path the in-flight run is usually the gate's
            # OWN re-entry, whose success still leaves the earlier failure to
            # be cleared — so wait it out and re-read the full set, rather than
            # acting on a snapshot taken mid-flight.
            #
            # The wait is capped by the gate's own short lifetime — window
            # (120s) + grace (90s) + settle (15s) — and costs nothing when the
            # gate finishes clean with no stale run beside it.
            echo "A gate run for ${HEAD_SHA} is still in flight; waiting for it rather than racing it."
            RECHECK_DEADLINE=$((SECONDS + ${WAKER_RECHECK_SECONDS:-240}))
            while :; do
              sleep 15
              RUN_JSON=$(gh api \
                "repos/${REPO}/actions/workflows/${GATE_WORKFLOW}/runs?head_sha=${HEAD_SHA}&per_page=100" \
                --jq '[.workflow_runs[] | {id, status, conclusion, attempt: .run_attempt}]')
              RUNNING=$(printf '%s' "${RUN_JSON}" | jq -r 'map(select(.status != "completed")) | length')
              [ "${RUNNING}" -eq 0 ] && break
              if [ ${SECONDS} -ge ${RECHECK_DEADLINE} ]; then
                echo "Gate run still in flight after the re-check budget; it outlives this waker and decides for itself."
                exit 0
              fi
            done
            TARGETS="$(stale_runs "${RUN_JSON}")"
          fi

          if [ -z "${TARGETS}" ]; then
            echo "No completed, non-green gate run for ${HEAD_SHA}. Either the gate is already green or the head has moved on and its own run decides. Nothing to wake."
            exit 0
          fi

          # A re-run races the gate's own re-entry when Codex posts a summary
          # comment AND a formal review: whichever starts first wins the
          # concurrency group and the other is cancelled. Both read the same
          # verdict, so either outcome is correct — a 409 here means the winner
          # got there first. That is a no-op, not a failure, which is why the
          # loop never exits non-zero: this job asks, it does not decide.
          #
          # SERIALIZED, and that is the whole subtlety. Every gate run shares
          # the consumer stub's concurrency group, which sets
          # `cancel-in-progress: true` — so firing these re-runs back to back
          # would have each new attempt CANCEL the one before it, leaving a
          # cancelled run behind. A cancelled run is non-green, so the loop
          # would manufacture exactly the stale artifact it exists to clear.
          # Each re-run therefore waits for its predecessor to finish. The wait
          # is skipped after the LAST target, so the ordinary case — a single
          # stale run, which is what every occurrence so far has been — costs
          # nothing.
          # NO count budget. Draining is the whole contract: re-running some of
          # the stale runs and returning leaves the rest red, and nothing
          # generates another verdict event to finish the job — the pull
          # request stays blocked until a human intervenes, which is the state
          # this workflow exists to abolish. The loop is bounded by time
          # instead (the per-wait deadline below, under the job timeout), so it
          # is finite without ever being deliberately incomplete.
          REMAINING=$(printf '%s' "${TARGETS}" | grep -c .)
          for TARGET in ${TARGETS}; do
            REMAINING=$((REMAINING - 1))
            echo "Re-running gate run ${TARGET} so it re-reads the verdict for ${HEAD_SHA}."
            if ! gh api --method POST "repos/${REPO}/actions/runs/${TARGET}/rerun" >/dev/null 2>&1; then
              echo "::notice::Could not re-run ${TARGET} — most likely another event (a formal review, or a newer push) already restarted the gate for this head. No action needed."
              continue
            fi
            [ "${REMAINING}" -le 0 ] && break
            SERIAL_DEADLINE=$((SECONDS + ${WAKER_RECHECK_SECONDS:-240}))
            while :; do
              sleep 15
              RERUN_STATE=$(gh api "repos/${REPO}/actions/runs/${TARGET}" --jq '.status' 2>/dev/null || true)
              [ "${RERUN_STATE}" = "completed" ] && break
              if [ ${SECONDS} -ge ${SERIAL_DEADLINE} ]; then
                # Stopping is the only safe move: the next POST would enter
                # the same concurrency group and cancel this still-running
                # attempt. Say plainly what is left and how to finish it,
                # because no further event is guaranteed.
                echo "::error::Gate run ${TARGET} is still going after ${WAKER_RECHECK_SECONDS:-240}s, and starting the next re-run would cancel it. ${REMAINING} stale gate run(s) for ${HEAD_SHA} remain red; re-run them from the Actions tab to unblock the merge."
                exit 0
              fi
            done
          done
