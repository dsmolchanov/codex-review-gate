name: probe
on:
  pull_request:
jobs:
  direct:
    runs-on: ubuntu-latest
    steps:
      - env:
          JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: echo "PROBE direct job.workflow_ref=[${JOB_WORKFLOW_REF}] job.workflow_sha=[${JOB_WORKFLOW_SHA}] github.sha=[${GITHUB_SHA}]"
  via-call:
    uses: dsmolchanov/codex-review-gate/.github/workflows/probe-callee.yml@probe/job-workflow-sha
